<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D'crias Barbershop</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial, Helvetica, sans-serif;

}

body{

background:#0b0b0b;

color:white;

}

header{

min-height:90vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:30px;

background:

linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9));

}

.logo{

width:150px;

margin-bottom:25px;

}

h1{

font-size:42px;

letter-spacing:2px;

}

h2{

margin-bottom:15px;

color:#d4af37;

}

p{

font-size:17px;

line-height:1.6;

}

.botao{

margin-top:25px;

padding:15px 35px;

background:#d4af37;

color:#000;

text-decoration:none;

border-radius:30px;

font-weight:bold;

}

section{

padding:50px 25px;

text-align:center;

}

.cards{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:20px;

}

.card{

background:#171717;

padding:25px;

border-radius:15px;

width:280px;

border:1px solid #333;

}

.fotos{

display:flex;

gap:15px;

justify-content:center;

flex-wrap:wrap;

}

.foto{

width:280px;

height:300px;

background:#222;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

color:#888;

}

footer{

background:#000;

padding:30px;

text-align:center;

}

</style>

</head>
