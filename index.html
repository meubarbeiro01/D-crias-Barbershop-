<style>
  /* Reset e Cores Globais Baseadas na Logo */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: #0d2c18; /* Fundo Verde Profundo da Logo */
    color: #ffffff; /* Texto Claro para Contraste */
    line-height: 1.6;
    padding: 20px 15px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 480px; /* Largura ideal para telas de celular */
    text-align: center;
  }

  /* Cabeçalho & Logo */
  header {
    margin-top: 10px;
    margin-bottom: 25px;
  }

  .logo-box {
    width: 130px; /* Um pouco maior para destacar a logo detalhada */
    height: 130px;
    margin: 0 auto 15px;
    border-radius: 50%;
    border: 4px solid #b87c4c; /* Borda Cobre Envelhecido da Logo */
    background-color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(184, 124, 76, 0.4); /* Brilho Cobre */
    overflow: hidden;
  }

  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Garante que a logo apareça por inteiro */
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 800;
    color: #79f15d; /* Verde Limão Metálico da Logo */
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* Melhora leitura */
  }

  .slogan {
    color: #b87c4c; /* Cobre Envelhecido da Logo */
    font-size: 1rem;
    font-weight: 600;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .intro-text {
    color: #d1d1d1; /* Cinza Muito Claro para Texto de Apoio */
    font-size: 0.9rem;
    margin-top: 12px;
    padding: 0 10px;
  }

  /* Seções e Cards */
  .section-title {
    font-size: 1.3rem;
    color: #79f15d; /* Verde Limão Metálico */
    text-align: left;
    margin: 35px 0 18px 0;
    padding-bottom: 5px;
    border-bottom: 3px solid #b87c4c; /* Linha Cobre */
    display: inline-block;
  }

  .card {
    background: #141f17; /* Verde Escuro Intermediário para os Cards */
    border: 1px solid #b87c4c; /* Borda Cobre */
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    text-align: left;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(121, 241, 93, 0.15); /* Brilho Verde Suave no Hover */
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: #ffffff; /* Texto Branco no Card para Máxima Leitura */
  }

  .card-price {
    color: #79f15d; /* Preço Verde Limão */
    font-weight: 700;
    font-size: 1rem;
  }

  .card-desc {
    color: #d1d1d1; /* Texto de Descrição Claro */
    font-size: 0.88rem;
    margin-top: 6px;
  }

  /* Botão Principal de WhatsApp */
  .btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background-color: #25d366; /* Mantemos o Verde Oficial do WhatsApp */
    color: #ffffff;
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 30px;
    margin: 35px 0 25px;
    box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
    transition: transform 0.2s ease;
  }

  .btn-whatsapp:active {
    transform: scale(0.98);
  }

  /* Informações de Localização */
  .info-box {
    background: rgba(0, 0, 0, 0.2); /* Fundo sutil */
    border-radius: 12px;
    padding: 20px;
    margin-top: 30px;
    border: 1px dashed #b87c4c; /* Borda Pontilhada Cobre */
    text-align: left;
  }

  .info-item {
    font-size: 0.9rem;
    color: #e0e0e0;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-item strong {
    color: #79f15d; /* Destaque em Verde Limão */
  }

  .info-item:last-child {
    margin-bottom: 0;
  }

  footer {
    margin-top: 40px;
    color: #888888;
    font-size: 0.75rem;
  }
</style>
