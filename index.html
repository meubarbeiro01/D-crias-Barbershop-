<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-crias Barbershop</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 40px 20px;
      background: #000;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    .botao {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background: #c99a3a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .servicos {
      padding: 30px 20px;
    }

    .card {
      background: #222;
      margin: 15px auto;
      padding: 20px;
      max-width: 300px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>D-crias Barbershop</h1>
  <p>Estilo, experiência e qualidade em cada corte.</p>

  <a class="botao" href="#">
    Agende seu horário
  </a>
</header>

<section class="servicos">

  <div class="card">
    <h2>Corte Masculino</h2>
    <p>Precisão e acabamento profissional.</p>
  </div>

  <div class="card">
    <h2>Barba</h2>
    <p>Design e cuidado para seu estilo.</p>
  </div>

  <div class="card">
    <h2>Experiência D-crias</h2>
    <p>Mais que um corte, uma experiência.</p>
  </div>

</section>

</body>
</html>
